# Module definitions for the auto-p2docking pipeline "main" script.
#
# Each module has its own section, introduced by a header line of the form
# "[command]", where <command> is the exact value used in the "command"
# column of /data/pipeline. Add a new module by appending a new section
# below -- no changes to the main script are required.
#
# Recognized settings inside a section (all optional, default "no"):
#   BLOCK               yes = this module supports per-protein execution,
#                       optionally as a group of consecutive BLOCK=yes
#                       commands. The branch determines ligand/receptor role.
#   NEEDS_LIGANDS_LIST  yes = this module supports per-ligand selection.
#   NEEDS_RECEPTORS_LIST yes = this module supports per-receptor selection.
#                       Either flag also triggers per-protein iteration when
#                       BLOCK=no. When BLOCK=yes and both flags are yes, the
#                       module runs once per protein on the matching branch,
#                       NOT once for each list on every pipeline line.
#                       Existing BLOCK=yes modules without list flags retain
#                       their original ligand-only behavior.
#   source_PDBs         yes = this module reads PDB files directly from the
#                       PDBs/Ligands and PDBs/Receptor folders (in addition
#                       to whatever is declared in the "input" column of
#                       /data/pipeline). Used only by pipeline_drawing to
#                       add the otherwise-missing links from those folders
#                       to this module in the rendered graph.
#   INPUT_TYPES         optional = space-separated logical data types that
#                       this module accepts through the "input" column of
#                       /data/pipeline.
#   OUTPUT_TYPES        optional = space-separated logical data types that
#                       this module produces in the "output" column of
#                       /data/pipeline.
#
#                       These settings are used only to validate direct
#                       module-to-module connections. If either side has no
#                       declared types, that connection is not blocked.
#
#   keep_files "name_or_glob_pattern" "dest_name"  (optional, may be
#   repeated any number of times): after the module runs, searches for a
#   file or folder named "name_or_glob_pattern" (wildcards such as "*" or
#   "*A" are supported) in the module's output folder (/data/$project/
#   $output, including subfolders); only if nothing is found there is its
#   intermediate_files folder (/data/$project/intermediate_files/
#   $prefix_mod, including subfolders) searched instead, and the match is
#   copied to /data/files_to_keep/dest_name. A bare "*" pattern matches the
#   whole output folder itself (i.e. copies it as-is). If both
#   "name_or_glob_pattern" and "dest_name" contain a "*", it is replaced in
#   "dest_name" with whatever part of the actual name the "*" matched
#   (handy to preserve a file's original extension). If
#   /data/files_to_keep/dest_name already exists, an increasing ".N" suffix
#   is appended (dest_name, then dest_name.1, dest_name.2, ...) so nothing
#   gets overwritten. Does nothing, without error, if no match is found.
#   $project and $prefix_mod (e.g. "B1C1") are available to build
#   "dest_name".
#
# Template for a new section:
#
# [my_module]
# BLOCK=no
# NEEDS_LIGANDS_LIST=no
# NEEDS_RECEPTORS_LIST=no
# source_PDBs=no
# INPUT_TYPES=
# OUTPUT_TYPES=
#
# keep_files "*" "my_module-$prefix_mod"

[hdock]
BLOCK=yes
NEEDS_LIGANDS_LIST=yes
source_PDBs=yes
OUTPUT_TYPES=protein_complex

keep_files "*" "hdock-$prefix_mod"

